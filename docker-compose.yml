services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: euroflowers
      POSTGRES_USER: euroflowers
      POSTGRES_PASSWORD: euroflowers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U euroflowers"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py create_admin && gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --graceful-timeout 30 --keep-alive 5"
    volumes:
      - ${MEDIA_HOST_PATH:-./media}:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info
    depends_on:
      - backend
      - redis
volumes:
  postgres_data:
